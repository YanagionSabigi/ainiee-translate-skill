<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320"><defs><filter id="paper"><feTurbulence baseFrequency=".55" numOctaves="3" seed="2"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer></filter></defs><rect width="800" height="320" fill="#f5f1e7"/><rect width="800" height="320" filter="url(#paper)"/><g fill="#36382f" font-family="Georgia,serif" transform="rotate(-.5 400 160)"><text x="55" y="62" font-size="19">4. The Gaussian integral</text><text x="85" y="182" font-size="66">∫</text><text x="111" y="123" font-size="25">∞</text><text x="111" y="204" font-size="25">−∞</text><text x="155" y="166" font-size="48" font-style="italic">e</text><text x="179" y="139" font-size="27">−x²</text><text x="237" y="166" font-size="42" font-style="italic">dx =</text><text x="366" y="166" font-size="46">√π</text><text x="680" y="166" font-size="21">(4.1)</text><text x="55" y="272" font-size="18" opacity=".65">where the integral is taken over the real line.</text></g></svg>