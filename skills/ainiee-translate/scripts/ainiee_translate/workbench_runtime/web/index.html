<!doctype html>
<!-- AiNiee / Refactoring UI §2.1, §3.6: primary=version comparison and decision;
     secondary=reading thoughts and source; tertiary=technical audit. One primary
     action=submit. Reuse upstream paper/ink/action, 14/18px type, 4..48px spacing. -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AiNiee · 校对工作台</title>
    <link rel="stylesheet" href="/static/styles/tokens.css" />
    <link rel="stylesheet" href="/static/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="/static/styles/app.css" />
    <script defer src="/static/vendor/katex/katex.min.js"></script>
    <script type="module" src="/static/scripts/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <button
          id="directory-toggle"
          aria-label="展开目录"
          title="展开目录"
          aria-expanded="false"
          aria-controls="sidebar"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M9 4v16" fill="none" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>
        <strong><span class="brand-product">AiNiee </span>校对工作台</strong>
      </div>
      <div class="top-actions">
        <span id="save-state" role="status">连接中</span
        ><button id="history-toggle">记录</button
        ><button id="submit">提交本轮</button>
      </div>
    </header>
    <div id="notice" role="alert" hidden></div>
    <div class="shell" id="shell">
      <aside class="sidebar" id="sidebar"></aside>
      <main>
        <section class="workspace-head">
          <div class="toolbar">
            <div id="statuses" class="statuses"></div>
            <span class="spacer"></span
            ><input
              type="search"
              id="search"
              aria-label="搜索审核材料"
              placeholder="搜索…"
            />
            <div class="views">
              <button id="focus-view" aria-pressed="true">逐条审核</button
              ><button id="flow-view" aria-pressed="false">连续审核</button>
            </div>
          </div>
        </section>
        <div class="review-layout">
          <aside class="queue" id="queue" aria-label="审核条目"></aside>
          <section id="articles" aria-label="审核内容"></section>
        </div>
      </main>
    </div>
    <button id="quote" class="quote-button" hidden>引用</button>
    <dialog id="modal">
      <div class="dialog-head">
        <h2 id="modal-title"></h2>
        <button id="modal-close" aria-label="关闭">×</button>
      </div>
      <div id="modal-body"></div>
      <div id="modal-actions"></div>
    </dialog>
    <dialog id="image-modal">
      <div class="dialog-head">
        <strong>源图</strong>
        <div id="image-tools"></div>
        <button id="image-close" aria-label="关闭源图">×</button>
      </div>
      <div id="image-stage">
        <img id="image-content" alt="放大的源图" draggable="false" />
      </div>
    </dialog>
    <noscript>请启用 JavaScript 以使用校对工作台。</noscript>
  </body>
</html>
