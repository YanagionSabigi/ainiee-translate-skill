[project]
name = "ainiee-translate"
version = "2.1.2"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
# Self-contained parse/export (vendored AiNiee readers/writers under _vendor/).
# No external AiNiee repo needed; these are all light pure-Python wheels.
dependencies = [
    "msgspec",          # cache.json (de)serialization
    "beautifulsoup4",   # epub / docx html parsing
    "lxml",             # bs4 "xml" parser backend (epub container/opf)
    "rich",             # reader/writer progress + info output
    "openpyxl",         # xlsx (Xlsx / WolfXlsx / TPP)
    "polib",            # po (gettext)
    "python-pptx",      # pptx
    "chardet",          # optional encoding sniff (txt/srt/...); graceful if absent
    "jsonschema>=4.23,<5", # bundled review-workbench protocol validation
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24", "jsonschema>=4.22"]

[tool.pytest.ini_options]
testpaths = ["测试"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.package-data]
ainiee_translate = ["*.html", "_vendor/NOTICE", "schemas/*.json", "schemas/*NOTICE*", "assets/*.css", "templates/book/*.yaml", "templates/book/*/*", "templates/book/latex/rosepine/*", "workbench_runtime/schemas/*.json", "workbench_runtime/web/**/*", "workbench_runtime/examples/**/*", "workbench_runtime/skill/**/*", "workbench_runtime/LICENSE", "workbench_runtime/UPSTREAM.md", "workbench_runtime/requirements.txt", "workbench_runtime/review_workbench/portable_templates/*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
